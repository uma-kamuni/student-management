name: CI/CD using Github Actions

on: 
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: setup java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build Application
        run: mvn clean package

      - name: Configure aws Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AK }}
          aws-secret-access-key: ${{ secrets.SAK }}
          aws-region: eu-north-1
          
      - name: Store artifact to s3
        run: aws s3 cp target/*.war s3://uma.online/student.war

      - name: Docker Build 
        run: | 
          docker build -t student . 
          docker images

      - name: Push image to ECR
        run: |
          aws ecr get-login-password --region eu-north-1 | docker login --username AWS --password-stdin 580222437000.dkr.ecr.eu-north-1.amazonaws.com
          docker tag student:latest 580222437000.dkr.ecr.eu-north-1.amazonaws.com/student:latest
          docker push 580222437000.dkr.ecr.eu-north-1.amazonaws.com/student:latest

      - name: Setup Terraform 
        uses: hashicorp/setup-terraform@v4

      - name: Terraform init
        run: terraform init
  
      - name: Terraform fmt 
        run: terraform fmt

      - name: Terraform validate
        run: terraform validate

      - name: Terraform Apply
        run: terraform apply -auto-approve -lock=false

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest
